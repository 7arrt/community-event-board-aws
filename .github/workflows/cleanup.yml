# Community Event Board — manual GitHub Actions cleanup.
#
# The GitHub Actions equivalent of the `cleanup` job in .gitlab-ci.yml. It is
# manual only and never runs on a push: deploys target the same account, so a
# cleanup on every push would destroy the environment being verified.
#
# It requires an explicit typed confirmation because stack deletion is
# irreversible, and it shares the `deploy-main` concurrency group so it can
# never start while a deploy is in flight.
#
# CREDENTIALS: same repository secrets and AWS_DEPLOY_ENABLED variable as the
# deploy workflow.

name: cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type delete-all-stacks to confirm destroying every stack'
        required: true
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-1' }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SHARED_CREDENTIALS_FILE: /dev/null

jobs:
  cleanup:
    name: cleanup (delete all stacks)
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm the destructive action
        run: |
          if [ "${{ inputs.confirm }}" != "delete-all-stacks" ]; then
            echo "::error::Refusing to run — type delete-all-stacks in the confirm input."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION || 'eu-west-1' }}
      - name: Delete every stack in reverse dependency order
        run: bash ci/cleanup.sh
